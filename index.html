<html lang="de">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LeseRegal" />
  <title>LeseRegal — Digitales Bücherregal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #0f1115;
      --bg-surface: #171a21;
      --bg-card: #1e232d;
      --bg-elevated: #262c38;
      --text-main: #f3f5f8;
      --text-muted: #9aa3b2;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.16);
      --emerald: #10b981;
      --indigo: #6366f1;
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #1b202c 0%, var(--bg-canvas) 65%);
      color: var(--text-main);
      min-height: 100dvh;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Holz-Regalboden für das digitale Bücherregal */
    .shelf-plank {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #5c3d28 0%, #3b2516 65%, #24160d 100%);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 224, 185, 0.25);
    }

    /* Buchcover mit Spine-Schatten */
    .book-cover {
      position: relative;
      overflow: hidden;
      box-shadow:
        0 10px 20px rgba(0, 0, 0, 0.45),
        inset 4px 0 8px rgba(0, 0, 0, 0.35),
        inset -1px 0 2px rgba(255, 255, 255, 0.14);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .book-card:active .book-cover {
      transform: translateY(-2px) scale(0.985);
    }

    /* Gestapelter Reihen-Look */
    .stack-layer-back {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      transform: translate(7px, -5px);
      opacity: 0.45;
      pointer-events: none;
    }

    .stack-layer-mid {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      transform: translate(3.5px, -2.5px);
      opacity: 0.72;
      pointer-events: none;
    }
  </style>
</head>
<body class="flex justify-center">
  <!-- App-Container: auf Mobile vollflächig, auf Desktop angenehm zentriert -->

    <!-- Oberer App-Header (ohne simulierte iPhone-Statusleiste) -->

            <span class="inline-flex h-7 w-7 items-center justify-center rounded-xl bg-amber-500/15 text-amber-400 font-bold text-sm">📚</span>
            <h1 class="text-lg font-extrabold tracking-tight">LeseRegal</h1>
          </div>
          <p id="header-subtitle" class="text-xs text-[var(--text-muted)] mt-0.5">Dein persönliches Bücherregal</p>
        </div>

        <div class="flex items-center gap-2">
          <button
            id="btn-export"
            type="button"
            title="Daten als JSON exportieren"
            class="px-2.5 py-2 rounded-xl text-xs font-medium bg-[var(--bg-card)] hover:bg-[var(--bg-elevated)] text-[var(--text-muted)] hover:text-white border border-[var(--border-subtle)] transition"

            Backup
          </button>
          <button
            id="btn-open-add"
            type="button"
            class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-lg shadow-amber-500/20 transition flex items-center gap-1.5"
          >
            <span>+ Buch</span>
          </button>
        </div>
      </div>

      <!-- Such- & Filterzeile für das Regal -->
      <div id="shelf-controls" class="mt-3 space-y-2.5">
        <div class="relative">
          <input
            id="search-input"
            type="text"
            placeholder="Titel, Autor oder Buchreihe suchen..."
            class="w-full rounded-xl bg-[var(--bg-surface)] border border-[var(--border-subtle)] px-3.5 py-2 text-sm text-white placeholder:text-[var(--text-muted)] focus:outline-none focus:border-amber-500/60"
          />
          <button
            id="clear-search"
            type="button"
            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-[var(--text-muted)] hover:text-white px-1.5 py-0.5"
          >
            ✕
          </button>
        </div>

        <div id="filter-chips" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-0.5">
          <button data-filter="all" class="filter-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition">Alle</button>
          <button data-filter="reading" class="filter-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition">Am Lesen</button>
          <button data-filter="finished" class="filter-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition">Gelesen</button>
          <button data-filter="series" class="filter-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition">Buchreihen</button>
          <button data-filter="wantToRead" class="filter-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition">Merkliste</button>
        </div>
      </div>
    </header>

    <!-- Hauptinhaltsbereich -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 py-4 pb-24 space-y-6"></main>

    <!-- Untere Tab-Navigation -->
    <nav class="fixed sm:absolute bottom-0 inset-x-0 z-20 backdrop-blur-xl bg-[var(--bg-surface)]/95 border-t border-[var(--border-subtle)] px-2 py-2">
      <div class="grid grid-cols-4 gap-1">
        <button data-tab="shelf" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-[11px] font-semibold transition">
          <span class="text-base leading-none mb-1">🏛️</span>
          <span>Regal</span>
        </button>
        <button data-tab="reading" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-[11px] font-semibold transition">
          <span class="text-base leading-none mb-1">📖</span>
          <span>Fortschritt</span>
        </button>
        <button data-tab="ai" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-[11px] font-semibold transition">
          <span class="text-base leading-none mb-1">✨</span>
          <span>KI-Tipps</span>
        </button>
        <button data-tab="stats" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-[11px] font-semibold transition">
          <span class="text-base leading-none mb-1">📊</span>
          <span>Statistik</span>

    <!-- Modal: Buchreihe anzeigen -->

            </div>
            <div>
              <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Genre</label>
              <select id="inp-genre" class="w-full rounded-xl bg-[var(--bg-card)] border border-[var(--border-subtle)] px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">

                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Thriller">Thriller</option>
                <option value="Sachbuch">Sachbuch</option>
                <option value="Klassiker">Klassiker</option>
                <option value="Drama">Drama</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Buchreihe (optional)</label>
              <input id="inp-series" type="text" placeholder="z. B. Königsmörder" class="w-full rounded-xl bg-[var(--bg-card)] border border-[var(--border-subtle)] px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" />
            </div>
            <div>
              <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Band-Nr.</label>
              <input id="inp-series-order" type="number" step="0.5" min="0.5" placeholder="z. B. 1" class="w-full rounded-xl bg-[var(--bg-card)] border border-[var(--border-subtle)] px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" />
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2.5">
            <div>
              <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Seiten gesamt</label>
              <input id="inp-pages" type="number" min="1" value="350" class="w-full rounded-xl bg-[var(--bg-card)] border border-[var(--border-subtle)] px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" />
            </div>
            <div>
              <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Status</label>
              <select id="inp-status" class="w-full rounded-xl bg-[var(--bg-card)] border border-[var(--border-subtle)] px-2.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                <option value="finished">Gelesen</option>
                <option value="reading">Am Lesen</option>
                <option value="wantToRead">Merkliste</option>

            </div>
            <div>
              <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Online-Schnitt</label>

            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Deine Bewertung (1–5 Sterne, optional)</label>
            <div id="inp-rating-stars" class="flex items-center gap-2"></div>
          </div>

          <div>
            <label class="block text-xs font-medium text-[var(--text-muted)] mb-1">Cover-Farbschema</label>
            <div id="inp-theme-picker" class="flex items-center gap-2.5"></div>
          </div>

          <button
            type="submit"
            class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shadow-lg shadow-amber-500/20 transition"
          >
            Ins Regal stellen
          </button>
        </form>
      </div>
    </div>
  </div>

    function loadState() {

        const raw = localStorage.getItem(STORAGE_KEY);

            activeTab: 'shelf',
            filter: 'all',
            search: '',
            ratingFilter: 'all',
            books: INITIAL_BOOKS,
            recommendations: AI_RECOMMENDATIONS_POOL.slice(0, 3),

            newBookTheme: 'amber'

        return {
          activeTab: parsed.activeTab || 'shelf',
          filter: parsed.filter || 'all',
          search: parsed.search || '',
          ratingFilter: parsed.ratingFilter || 'all',
          books: Array.isArray(parsed.books) && parsed.books.length ? parsed.books : INITIAL_BOOKS,
          recommendations: Array.isArray(parsed.recommendations) && parsed.recommendations.length ? parsed.recommendations : AI_RECOMMENDATIONS_POOL.slice(0, 3),
          newBookRating: parsed.newBookRating || 5,
          newBookTheme: parsed.newBookTheme || 'amber'
        };
      } catch (err) {
        console.error('Fehler beim Laden:', err);
        return {
          activeTab: 'shelf',
          filter: 'all',
          search: '',
          ratingFilter: 'all',
          books: INITIAL_BOOKS,
          recommendations: AI_RECOMMENDATIONS_POOL.slice(0, 3),
          newBookRating: 5,
          newBookTheme: 'amber'
        };
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('Fehler beim Speichern:', err);
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const textEl = document.getElementById('toast-text');
      if (!toast || !textEl) return;
      textEl.textContent = message;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    function getTheme(key) {
      return COVER_THEMES[key] || COVER_THEMES.amber;
    }

    function getProgressPercent(book) {
      if (!book.totalPages || book.totalPages <= 0) return 0;
      return Math.max(0, Math.min(100, Math.round((book.currentPage / book.totalPages) * 100)));
    }

    function getStatusLabel(status) {
      if (status === 'finished') return 'Gelesen';
      if (status === 'reading') return 'Am Lesen';
      return 'Merkliste';
    }

    function getStatusBadgeClass(status) {
      if (status === 'finished') return 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
      if (status === 'reading') return 'bg-amber-500/15 text-amber-300 border-amber-500/30';
      return 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30';
    }

    function formatRatingDiff(myRating, onlineRating) {
      if (!myRating || typeof onlineRating !== 'number') return null;
      const diff = Number((myRating - onlineRating).toFixed(1));
      if (Math.abs(diff) <= 0.2) {
        return {
          diff,
          label: 'Im Community-Takt',
          badgeClass: 'bg-slate-500/20 text-slate-200 border-slate-400/30'
        };
      }
      if (diff > 0) {
        return {
          diff,
          label: `+${diff.toFixed(1)} ★ begeisterter als Online`,
          badgeClass: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30'
        };
      }
      return {
        diff,
        label: `${diff.toFixed(1)} ★ kritischer als Online`,
        badgeClass: 'bg-rose-500/15 text-rose-300 border-rose-500/30'
      };
    }

    function renderBookCoverHTML(book, compact = false) {
      const theme = getTheme(book.theme);
      const pct = getProgressPercent(book);
      const showBar = book.status === 'reading' || (pct > 0 && pct < 100);

      return `
        <div class="book-cover rounded-xl ${compact ? 'aspect-[2/3]' : 'aspect-[2/3.05]'} flex flex-col justify-between p-2.5 select-none"
             style="background: linear-gradient(155deg, ${theme.from} 0%, ${theme.to} 100%);">
          <div class="flex items-center justify-between gap-1">
            <span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-black/35 text-white/90 truncate">
              ${book.genre || 'Buch'}
            </span>
            ${book.seriesOrder ? `<span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-black/40" style="color:${theme.accent}">#${book.seriesOrder}</span>` : ''}
          </div>

          <div class="my-auto py-1">
            <div class="text-[11px] sm:text-xs font-extrabold leading-tight text-white line-clamp-3 drop-shadow">
              ${book.title}
            </div>
            <div class="text-[10px] text-white/80 mt-1 line-clamp-1 font-medium">
              ${book.author}
            </div>
          </div>

          <div class="space-y-1">
            ${showBar ? `
              <div>
                <div class="flex justify-between text-[9px] font-bold text-white/90 mb-0.5">
                  <span>${pct}%</span>
                  <span>${book.currentPage}/${book.totalPages} S.</span>
                </div>
                <div class="h-1.5 w-full rounded-full bg-black/45 overflow-hidden">
                  <div class="h-full rounded-full transition-all duration-300" style="width:${pct}%; background:${theme.accent};"></div>
                </div>
              </div>
            ` : `
              <div class="flex items-center justify-between text-[9px] text-white/80 font-medium">
                <span>${book.totalPages || 0} S.</span>
                ${book.myRating ? `<span class="font-bold" style="color:${theme.accent}">★ ${book.myRating}/5</span>` : `<span>★ ${Number(book.onlineRating || 0).toFixed(1)}</span>`}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function buildShelfEntries(books) {
      const seriesMap = new Map();
      const standalone = [];

      books.forEach((b) => {
        if (b.series && b.series.trim()) {
          const key = b.series.trim();
          if (!seriesMap.has(key)) seriesMap.set(key, []);
          seriesMap.get(key).push(b);
        } else {
          standalone.push(b);
        }
      });

      const entries = [];
      seriesMap.forEach((items, seriesName) => {
        const sorted = [...items].sort((a, b) => (a.seriesOrder || 999) - (b.seriesOrder || 999));
        entries.push({
          type: 'series',
          id: 'series-' + seriesName,
          seriesName,
          books: sorted,
          leadBook: sorted[0]
        });
      });

      standalone.forEach((book) => {
        entries.push({
          type: 'book',
          id: book.id,
          book
        });
      });

      return entries;
    }

      const filteredBooks = state.books.filter((b) => {

          (b.series && b.series.toLowerCase().includes(query)) ||
          (b.genre && b.genre.toLowerCase().includes(query));

        if (!matchesSearch) return false;
        if (state.filter === 'reading') return b.status === 'reading';
        if (state.filter === 'finished') return b.status === 'finished';
        if (state.filter === 'wantToRead') return b.status === 'wantToRead';
        if (state.filter === 'series') return Boolean(b.series && b.series.trim());
        return true;
      });

      const currentlyReading = state.books.filter((b) => b.status === 'reading');
      const entries = buildShelfEntries(filteredBooks);

      const rows = [];

      const readingBannerHTML = currentlyReading.length ? `

                  <button

                  >
                    +15 S.
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </section>
      ` : '';

      const shelfRowsHTML = rows.length ? rows.map((row) => `
        <div class="space-y-1.5">
          <div class="grid grid-cols-3 gap-3 items-end px-1">
            ${row.map((entry) => {
              if (entry.type === 'series') {
                const theme = getTheme(entry.leadBook.theme);
                const finishedCount = entry.books.filter((x) => x.status === 'finished').length;
                return `
                  <div onclick="openSeriesModal('${encodeURIComponent(entry.seriesName)}')" class="book-card cursor-pointer flex flex-col">
                    <div class="relative pt-1.5 pr-1.5">
                      <div class="stack-layer-back" style="background:${theme.to}; border:1px solid rgba(255,255,255,0.12);"></div>
                      <div class="stack-layer-mid" style="background:${theme.from}; border:1px solid rgba(255,255,255,0.18);"></div>
                      <div class="relative">
                        ${renderBookCoverHTML(entry.leadBook)}
                        <span class="absolute top-2 right-2 px-1.5 py-0.5 rounded-md bg-slate-950/85 text-amber-300 text-[10px] font-extrabold border border-amber-400/30">
                          ${entry.books.length} Bände
                        </span>
                      </div>
                    </div>
                    <div class="mt-2 px-0.5">
                      <div class="text-xs font-bold truncate text-amber-300">📚 ${entry.seriesName}</div>
                      <div class="text-[11px] text-[var(--text-muted)] truncate">${finishedCount}/${entry.books.length} gelesen</div>
                    </div>
                  </div>
                `;
              }

              const b = entry.book;
              const diffObj = formatRatingDiff(b.myRating, b.onlineRating);
              return `
                <div onclick="openBookDetail('${b.id}')" class="book-card cursor-pointer flex flex-col">
                  ${renderBookCoverHTML(b)}
                  <div class="mt-2 px-0.5">
                    <div class="text-xs font-bold truncate">${b.title}</div>
                    <div class="text-[11px] text-[var(--text-muted)] truncate">${b.author}</div>
                    ${diffObj ? `
                      <div class="mt-1 inline-block text-[10px] font-semibold px-1.5 py-0.5 rounded border ${diffObj.badgeClass}">
                        ${diffObj.diff > 0 ? `+${diffObj.diff.toFixed(1)}` : diffObj.diff === 0 ? '0.0' : diffObj.diff.toFixed(1)} vs Online
                      </div>
                    ` : `
                      <div class="mt-1 text-[10px] text-[var(--text-muted)]">
                        Online ★ ${Number(b.onlineRating || 0).toFixed(1)}
                      </div>
                    `}

                </div>
              `;
            }).join('')}
          </div>
          <div class="shelf-plank"></div>
        </div>
      `).join('') : `
        <div class="rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-subtle)] p-8 text-center space-y-2">
          <div class="text-3xl">🔍</div>
          <div class="text-sm font-bold">Keine passenden Bücher gefunden</div>
          <p class="text-xs text-[var(--text-muted)]">Passe deine Suche oder den Filter an, um dein Regal zu sehen.</p>
        </div>
      `;

      main.innerHTML = `

          <div class="space-y-6">
            ${shelfRowsHTML}

    function renderStatsTab() {
      const main = document.getElementById('main-content');
      const finishedBooks = state.books.filter((b) => b.status === 'finished');
      const totalPagesRead = state.books.reduce((acc, b) => acc + (b.currentPage || 0), 0);
      const seriesCount = new Set(state.books.filter((b) => b.series).map((b) => b.series.trim())).size;

      // Bewertungsvergleich: Eigene Bewertung vs. Online-Bewertung
      const ratedBooks = state.books.filter((b) => typeof b.myRating === 'number' && typeof b.onlineRating === 'number');
      const avgMyRating = ratedBooks.length
        ? ratedBooks.reduce((s, b) => s + b.myRating, 0) / ratedBooks.length
        : 0;
      const avgOnlineRating = ratedBooks.length
        ? ratedBooks.reduce((s, b) => s + b.onlineRating, 0) / ratedBooks.length
        : 0;
      const avgDiff = Number((avgMyRating - avgOnlineRating).toFixed(2));

      let personalityTitle = 'Im Community-Takt';
      let personalityDesc = 'Deine Bewertungen liegen nah am allgemeinen Online-Schnitt.';
      if (avgDiff >= 0.25) {
        personalityTitle = 'Begeisterter Entdecker';
        personalityDesc = `Du vergibst im Schnitt +${avgDiff.toFixed(2)} ★ mehr als die Online-Community.`;
      } else if (avgDiff <= -0.25) {
        personalityTitle = 'Kritischer Kenner';
        personalityDesc = `Du bewertest im Schnitt ${avgDiff.toFixed(2)} ★ strenger als der Online-Durchschnitt.`;
      }

      const rankedByDiff = ratedBooks
        .map((b) => ({ book: b, diff: Number((b.myRating - b.onlineRating).toFixed(1)) }))
        .sort((a, b) => b.diff - a.diff);

      const hiddenGem = rankedByDiff[0] || null;
      const biggestControversy = rankedByDiff[rankedByDiff.length - 1] || null;

      const filteredComparison = ratedBooks.filter((b) => {
        const diff = b.myRating - b.onlineRating;
        if (state.ratingFilter === 'higher') return diff > 0.2;
        if (state.ratingFilter === 'lower') return diff < -0.2;
        return true;
      });

      // Seiten pro Monat
      const months = ['Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov'];
      const monthMap = {};
      months.forEach((m) => (monthMap[m] = 0));
      state.books.forEach((b) => {
        const m = b.monthFinished || 'Nov';
        if (monthMap[m] !== undefined) {
          monthMap[m] += b.currentPage || 0;
        }
      });
      const maxMonthPages = Math.max(1, ...Object.values(monthMap));

      // Genre-Verteilung
      const genreCounts = {};
      state.books.forEach((b) => {
        const g = b.genre || 'Sonstiges';
        genreCounts[g] = (genreCounts[g] || 0) + 1;
      });
      const genreEntries = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]);

      main.innerHTML = `
        <!-- Kennzahlen-Kacheln -->
        <section class="grid grid-cols-3 gap-2.5">
          <div class="rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-subtle)] p-3 text-center">
            <div class="text-lg font-extrabold text-amber-400">${finishedBooks.length}</div>
            <div class="text-[11px] text-[var(--text-muted)]">Gelesen</div>

      const sheet = document.getElementById('series-sheet');

      sheet.innerHTML = `
        <div class="flex items-center justify-between gap-2">

            <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400">📚 Buchreihe</span>

            return `

                  </div>
                  <div class="text-sm font-bold truncate mt-0.5">${b.title}</div>
                  <div class="text-xs text-[var(--text-muted)]">${b.author} · ${pct}% · Online ★ ${Number(b.onlineRating || 0).toFixed(1)}</div>

    function closeModal(modalId) {
      const el = document.getElementById(modalId);
      if (!el) return;
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function updateBookPage(bookId, newPage) {
      const book = state.books.find((b) => b.id === bookId);
      if (!book) return;
      const maxPages = book.totalPages || 100;
      book.currentPage = Math.max(0, Math.min(maxPages, newPage));
      if (book.currentPage >= maxPages && maxPages > 0) {
        book.status = 'finished';
        if (!book.monthFinished) book.monthFinished = 'Nov';
      } else if (book.currentPage > 0 && book.status === 'wantToRead') {
        book.status = 'reading';
      }
      saveState();
      render();
    }

    function quickAddPages(bookId, delta) {
      const book = state.books.find((b) => b.id === bookId);
      if (!book) return;
      const maxPages = book.totalPages || 100;
      book.currentPage = Math.max(0, Math.min(maxPages, (book.currentPage || 0) + delta));
      if (book.status === 'wantToRead') book.status = 'reading';
      if (book.currentPage >= maxPages && maxPages > 0) {
        book.status = 'finished';
        if (!book.monthFinished) book.monthFinished = 'Nov';
        showToast(`„${book.title}“ abgeschlossen!`);
      } else {
        showToast(`+${delta} Seiten bei „${book.title}“`);
      }
      saveState();
      render();
    }

    function markBookFinished(bookId) {
      const book = state.books.find((b) => b.id === bookId);
      if (!book) return;
      book.currentPage = book.totalPages || book.currentPage || 100;
      book.status = 'finished';
      if (!book.monthFinished) book.monthFinished = 'Nov';
      saveState();
      showToast(`„${book.title}“ als gelesen markiert`);
      render();
    }

    function startReadingBook(bookId) {
      const book = state.books.find((b) => b.id === bookId);
      if (!book) return;
      book.status = 'reading';
      if (!book.currentPage) book.currentPage = 1;
      saveState();
      showToast(`Du liest jetzt „${book.title}“`);
      render();
    }

    function setBookRating(bookId, rating) {
      const book = state.books.find((b) => b.id === bookId);
      if (!book) return;
      book.myRating = rating;
      saveState();
      showToast(rating ? `Mit ${rating} Sternen bewertet` : 'Bewertung entfernt');
      render();
    }

    function deleteBook(bookId) {
      state.books = state.books.filter((b) => b.id !== bookId);
      saveState();
      closeModal('detail-modal');
      showToast('Buch entfernt');
      render();
    }

    function refreshRecommendations() {
      const shuffled = [...AI_RECOMMENDATIONS_POOL].sort(() => Math.random() - 0.5);
      state.recommendations = shuffled.slice(0, 3);
      saveState();
      showToast('Neue KI-Empfehlungen erstellt');
      render();
    }

    function addRecommendationToShelf(recId) {
      const rec = state.recommendations.find((r) => r.id === recId);
      if (!rec) return;
      const newBook = {
        id: 'b-' + Date.now(),
        title: rec.title,
        author: rec.author,
        genre: rec.genre || 'Fantasy',
        series: rec.series || null,
        seriesOrder: rec.seriesOrder || null,
        totalPages: rec.totalPages || 350,
        currentPage: 0,
        status: 'wantToRead',
        myRating: null,
        onlineRating: rec.onlineRating || 4.3,
        onlineReviewCount: 52000,
        dateFinished: null,
        monthFinished: 'Nov',
        theme: rec.theme || 'amber',
        notes: `KI-Empfehlung (${rec.matchScore}% Match): ${rec.reason}`
      };
      state.books.unshift(newBook);
      saveState();
      showToast(`„${rec.title}“ ins Regal übernommen`);
      render();
    }

    function setRatingFilter(filter) {
      state.ratingFilter = filter;
      saveState();
      render();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      saveState();
      render();
    }

    function renderAddFormControls() {
      const starsEl = document.getElementById('inp-rating-stars');
      const themeEl = document.getElementById('inp-theme-picker');

      if (starsEl) {
        starsEl.innerHTML = [1, 2, 3, 4, 5].map((n) => `
          <button
            type="button"
            onclick="selectNewBookRating(${n})"
            class="text-2xl leading-none ${state.newBookRating >= n ? 'text-amber-400' : 'text-slate-600'}"
          >★</button>
        `).join('');
      }

      if (themeEl) {
        themeEl.innerHTML = Object.entries(COVER_THEMES).map(([key, t]) => `
          <button
            type="button"
            onclick="selectNewBookTheme('${key}')"
            title="${t.label}"
            class="h-7 w-7 rounded-full border-2 transition ${state.newBookTheme === key ? 'border-white scale-110' : 'border-transparent opacity-75'}"
            style="background: linear-gradient(135deg, ${t.from}, ${t.to});"
          ></button>
        `).join('');
      }
    }

    function selectNewBookRating(n) {
      state.newBookRating = n;
      renderAddFormControls();
    }

    function selectNewBookTheme(key) {
      state.newBookTheme = key;
      renderAddFormControls();

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        const isActive = btn.dataset.tab === state.activeTab;
        btn.className = `nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-[11px] font-semibold transition ${
          isActive
            ? 'text-amber-400 bg-amber-500/12'
            : 'text-[var(--text-muted)] hover:text-white'
        }`;
      });

      const shelfControls = document.getElementById('shelf-controls');
      if (shelfControls) {
        shelfControls.style.display = state.activeTab === 'shelf' ? 'block' : 'none';
      }

      document.querySelectorAll('.filter-chip').forEach((chip) => {
        const active = chip.dataset.filter === state.filter;
        chip.className = `filter-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border transition ${
          active
            ? 'bg-amber-500 text-slate-950 border-amber-500'
            : 'bg-[var(--bg-card)] text-[var(--text-muted)] hover:text-white border-[var(--border-subtle)]'
        }`;
      });

      const subtitles = {
        shelf: 'Dein persönliches Bücherregal',
        reading: 'Lesefortschritt & Merkliste',
        ai: 'KI-Empfehlungen für deinen Geschmack',
        stats: 'Auswertungen & Bewertungs-Radar'
      };
      const subEl = document.getElementById('header-subtitle');
      if (subEl) subEl.textContent = subtitles[state.activeTab] || 'LeseRegal';
    }

    function render() {
      renderNavigationAndFilters();
      const main = document.getElementById('main-content');
      if (!main) return;

      if (state.activeTab === 'shelf') renderShelfTab();
      else if (state.activeTab === 'reading') renderReadingTab();
      else if (state.activeTab === 'ai') renderAITab();
      else if (state.activeTab === 'stats') renderStatsTab();
    }

    // Event-Listener initialisieren
    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    document.querySelectorAll('.filter-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        state.filter = chip.dataset.filter;
        saveState();
        render();
      });
    });

    const searchInput = document.getElementById('search-input');
    const clearSearch = document.getElementById('clear-search');
    if (searchInput) {
      searchInput.value = state.search;
      searchInput.addEventListener('input', (e) => {
        state.search = e.target.value;
        if (clearSearch) clearSearch.classList.toggle('hidden', !state.search);
        saveState();
        renderShelfTab();
      });
    }
    if (clearSearch) {
      clearSearch.classList.toggle('hidden', !state.search);
      clearSearch.addEventListener('click', () => {
        state.search = '';
        if (searchInput) searchInput.value = '';
        clearSearch.classList.add('hidden');
        saveState();
        renderShelfTab();
      });
    }

    document.getElementById('btn-open-add')?.addEventListener('click', () => {
      renderAddFormControls();
      const modal = document.getElementById('add-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    });

    document.getElementById('btn-close-add')?.addEventListener('click', () => closeModal('add-modal'));

    ['detail-modal', 'series-modal', 'add-modal'].forEach((id) => {
      const el = document.getElementById(id);
      el?.addEventListener('click', (e) => {
        if (e.target === el) closeModal(id);
      });
    });

    document.getElementById('add-book-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('inp-title').value.trim();
      const author = document.getElementById('inp-author').value.trim();
      if (!title || !author) return;

      const genre = document.getElementById('inp-genre').value;
      const series = document.getElementById('inp-series').value.trim() || null;
      const orderVal = parseFloat(document.getElementById('inp-series-order').value);
      const seriesOrder = series && !Number.isNaN(orderVal) ? orderVal : (series ? 1 : null);
      const totalPages = Math.max(1, parseInt(document.getElementById('inp-pages').value, 10) || 300);
      const status = document.getElementById('inp-status').value;
      const onlineRating = Math.max(1, Math.min(5, parseFloat(document.getElementById('inp-online-rating').value) || 4.2));

      const currentPage = status === 'finished' ? totalPages : status === 'reading' ? Math.round(totalPages * 0.15) : 0;

      const newBook = {
        id: 'b-' + Date.now(),
        title,
        author,
        genre,
        series,
        seriesOrder,
        totalPages,
        currentPage,
        status,
        myRating: status === 'wantToRead' ? null : state.newBookRating,
        onlineRating,
        onlineReviewCount: 28400,
        dateFinished: status === 'finished' ? new Date().toISOString().slice(0, 10) : null,
        monthFinished: 'Nov',
        theme: state.newBookTheme || 'amber',
        notes: ''
      };

      state.books.unshift(newBook);
      saveState();
      e.target.reset();
      closeModal('add-modal');
      showToast(`„${title}“ hinzugefügt`);
      switchTab('shelf');
    });

    document.getElementById('btn-export')?.addEventListener('click', () => {
      try {
        const blob = new Blob([JSON.stringify(state.books, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'leseregal-backup.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('JSON-Backup heruntergeladen');
      } catch (err) {
        showToast('Export fehlgeschlagen');
      }
    });

    render();
  </script>
</body>
</html>
